name: Qodana Flutter

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        working-directory: src/flutter
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: src/flutter
        run: flutter analyze

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: >
            --linter jetbrains/qodana-jvm-community:latest
            --project-dir src/flutter

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qodana-report
          path: .qodana/results