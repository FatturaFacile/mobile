version: 2
updates:
  # GitHub Actions: one grouped PR per week
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 2
    assignees:
      - "aledv"
      - "davide-nava"
    groups:
      github-actions:
        patterns:
          - "*"

  # pub (Flutter): one grouped PR for minor and patch updates; major versions are handled by hand
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 2
    assignees:
      - "aledv"
      - "davide-nava"
    commit-message:
      prefix: "deps"
    groups:
      pub-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Gradle (Android): one grouped PR for minor and patch updates; major versions are handled by hand
  - package-ecosystem: "gradle"
    directories:
      - "/android"
      - "/android/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 2
    assignees:
      - "aledv"
      - "davide-nava"
    commit-message:
      prefix: "deps"
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
